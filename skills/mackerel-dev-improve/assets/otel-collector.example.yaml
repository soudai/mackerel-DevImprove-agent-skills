# OpenTelemetry Collector Contrib 0.163.2; validate before using another version.
# Same-host development example. Applications must set their own service identity.
# See references/observability-setup.md before starting this collector.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 127.0.0.1:4317
      http:
        endpoint: 127.0.0.1:4318
  prometheus/collector:
    config:
      scrape_configs:
        - job_name: dev-otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: [127.0.0.1:8888]

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  attributes/remove_sensitive_headers:
    actions:
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.proxy_authorization
        action: delete
      - key: http.request.header.cookie
        action: delete
      - key: http.response.header.set_cookie
        action: delete
  resource/collector:
    attributes:
      - key: service.name
        value: dev-otel-collector
        action: upsert
      - key: service.namespace
        value: development-observability
        action: upsert
      - key: deployment.environment.name
        value: development
        action: upsert
      - key: service.instance.id
        value: "${env:OTELCOL_INSTANCE_ID}"
        action: upsert

exporters:
  otlp_http/mackerel:
    endpoint: https://otlp-vaxila.mackerelio.com
    headers:
      Accept: "*/*"
      Mackerel-Api-Key: "${env:MACKEREL_APIKEY}"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 20000000
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 1000000
        max_size: 3500000
        flush_timeout: 5s
  otlp/mackerel_metrics:
    endpoint: otlp.mackerelio.com:4317
    headers:
      Mackerel-Api-Key: "${env:MACKEREL_APIKEY}"
    timeout: 10s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 120s
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 20000000
      num_consumers: 2
      batch:
        sizer: bytes
        min_size: 1000000
        max_size: 3500000
        flush_timeout: 5s

service:
  telemetry:
    resource:
      service.instance.id: "${env:OTELCOL_INSTANCE_ID}"
    metrics:
      level: normal
      readers:
        - pull:
            exporter:
              prometheus:
                host: 127.0.0.1
                port: 8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/remove_sensitive_headers]
      exporters: [otlp_http/mackerel]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/remove_sensitive_headers]
      exporters: [otlp_http/mackerel]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter]
      exporters: [otlp/mackerel_metrics]
    metrics/collector:
      receivers: [prometheus/collector]
      processors: [memory_limiter, resource/collector]
      exporters: [otlp/mackerel_metrics]
